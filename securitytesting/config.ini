# OWASP Security Testing Configuration
# Configuration file for security assessment parameters

[application]
# Application URLs for testing
backend_url = http://localhost:8000
frontend_url = http://localhost:3000

[authentication]
# Test credentials for different roles
# Note: These should match your test database users
superadmin_username = superadmin
superadmin_password = admin123

client_admin_username = client_admin
client_admin_password = admin123

user_username = testuser
user_password = user123

[testing]
# Testing parameters
request_timeout = 10
max_test_requests = 20
rate_limit_test_duration = 10
enable_destructive_tests = false

[reporting]
# Report generation settings
output_directory = ./
generate_html_report = true
generate_json_report = true
include_evidence = true
include_recommendations = true

[owasp_categories]
# OWASP Top 10 2021 categories to test
test_a01_broken_access_control = true
test_a02_cryptographic_failures = true
test_a03_injection = true
test_a04_insecure_design = true
test_a05_security_misconfiguration = true
test_a06_vulnerable_components = true
test_a07_identification_auth_failures = true
test_a08_software_data_integrity = true
test_a09_security_logging_monitoring = true
test_a10_server_side_request_forgery = true

[severity_levels]
# Minimum severity level to report
min_severity = LOW
fail_on_critical = true
fail_on_high = false

[advanced]
# Advanced testing options (use with caution)
test_sql_injection = true
test_xss = false  # Requires frontend testing
test_csrf = false  # Requires session management
test_file_upload = false  # Requires file upload endpoints
custom_payloads_file = 
proxy_url = 
user_agent = OWASP-SecurityTester/1.0

# Advanced Security Tools Configuration
[static_analysis]
enable_bandit = true
bandit_exclude_dirs = .git,__pycache__,.pytest_cache,node_modules
bandit_severity_level = LOW

[dependency_scanning]
enable_safety = true
safety_full_report = true
ignore_vulnerabilities = 

[cryptographic_analysis]
enable_crypto_analysis = true
check_jwt_security = true
analyze_hash_algorithms = true
check_encryption_methods = true

[code_scanning]
enable_secrets_scan = true
scan_for_hardcoded_secrets = true
secret_patterns_file = 
exclude_files = *.log,*.pyc,*.pyo

[reporting]
generate_advanced_html = true
include_code_snippets = true
max_issues_per_category = 50
severity_threshold = LOW