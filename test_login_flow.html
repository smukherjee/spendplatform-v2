<!DOCTYPE html>
<html>
<head>
    <title>Test Login Flow</title>
</head>
<body>
    <h1>Test Login Flow</h1>
    <button onclick="testLogin()">Test Login with /auth/me</button>
    <div id="output" style="margin-top: 20px; padding: 10px; background: #f5f5f5; white-space: pre-wrap;"></div>

    <script>
        async function testLogin() {
            const output = document.getElementById('output');
            output.textContent = 'Starting login test...\n';
            
            try {
                // Step 1: Get token
                output.textContent += '1. Getting token...\n';
                const params = new URLSearchParams();
                params.append('username', 'superadmin');
                params.append('password', 'superadmin123');
                
                const tokenResponse = await fetch('http://localhost:8001/api/v1/auth/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: params
                });
                
                const tokenData = await tokenResponse.json();
                output.textContent += `✅ Token received: ${tokenData.access_token.substring(0, 50)}...\n\n`;
                
                // Step 2: Get user profile
                output.textContent += '2. Getting user profile...\n';
                const profileResponse = await fetch('http://localhost:8001/api/v1/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${tokenData.access_token}`
                    }
                });
                
                const profileData = await profileResponse.json();
                output.textContent += `✅ User profile received:\n${JSON.stringify(profileData, null, 2)}\n\n`;
                
                // Step 3: Simulate complete login response
                const completeLoginResponse = {
                    ...tokenData,
                    user: {
                        id: profileData.id,
                        username: profileData.username,
                        email: profileData.email,
                        role: profileData.roles ? profileData.roles[0] : 'user',
                        roles: profileData.roles || [],
                        client_id: profileData.client_id,
                        user_id: profileData.id,
                        personalisation: profileData.personalisation
                    }
                };
                
                output.textContent += '3. Complete login response:\n';
                output.textContent += JSON.stringify(completeLoginResponse, null, 2);
                
            } catch (error) {
                output.textContent += `❌ Error: ${error.message}\n`;
                console.error('Login test failed:', error);
            }
        }
    </script>
</body>
</html>
